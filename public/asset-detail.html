<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Record — Gulberg City Office</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-32.png" />
<meta name="theme-color" content="#0f1a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GCO" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <a class="back-link" href="agricultural.html" id="back-link">&larr; Back</a>
        <div class="banner" id="page-banner" hidden></div>

        <div class="detail-header">
          <div>
            <h1 id="entity-name">Loading…</h1>
            <div class="meta" id="entity-meta"></div>
          </div>
          <div class="row-actions">
            <button class="btn btn-ghost" id="print-statement-btn">🖨 Print Full Statement</button>
            <button class="btn btn-ghost" id="mark-sold-btn" hidden>Mark Sold</button>
            <button class="btn btn-ghost" id="cancel-sale-btn" hidden>Cancel Sale</button>
            <button class="btn btn-ghost" id="reactivate-btn" hidden>Reactivate</button>
            <button class="btn btn-ghost" id="edit-entity-btn">Edit</button>
            <button class="btn btn-danger" id="delete-entity-btn">Delete</button>
          </div>
        </div>

        <div class="grid grid-4" id="entity-tiles" style="margin-top:20px;"></div>

        <div class="grid grid-2" id="entity-info-cards" style="margin-top:20px;"></div>

        <div class="section-title">
          <h2>Payments</h2>
          <div class="row-actions">
            <button class="btn btn-ghost" id="add-plan-btn">+ Create Installment Plan</button>
            <button class="btn btn-accent" id="add-payment-btn">+ Add Payment</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Type</th>
                <th class="text-right">Amount</th>
                <th>Due date</th>
                <th>Settled</th>
                <th>Paid Through</th>
                <th>Notes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="payments-body"><tr class="empty-row"><td colspan="7">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <script src="js/common.js"></script>
  <script src="js/asset-detail.js"></script>
</body>
</html>
