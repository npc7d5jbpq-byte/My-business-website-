<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="45%" stop-color="#101e36"/>
      <stop offset="75%" stop-color="#16294a"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#c9973f" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#c9973f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c9973f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1088" cy="558" rx="620" ry="480" fill="url(#glow)"/>

  <!-- distant skyline (fainter) -->
  <g fill="#0f1c33" opacity="0.55">
    <rect x="-20" y="640" width="70" height="220"/>
    <rect x="60" y="600" width="55" height="260"/>
    <rect x="130" y="660" width="90" height="200"/>
    <rect x="240" y="610" width="60" height="250"/>
    <rect x="320" y="650" width="100" height="210"/>
    <rect x="440" y="590" width="50" height="270"/>
    <rect x="1150" y="620" width="80" height="240"/>
    <rect x="1250" y="580" width="60" height="280"/>
    <rect x="1330" y="640" width="110" height="220"/>
    <rect x="1470" y="600" width="60" height="260"/>
    <rect x="1550" y="655" width="70" height="205"/>
  </g>

  <!-- main skyline (closer, sharper) -->
  <g fill="#0b1526">
    <rect x="20" y="560" width="90" height="340"/>
    <rect x="120" y="500" width="60" height="400"/>
    <rect x="190" y="600" width="120" height="300"/>
    <rect x="320" y="470" width="70" height="430"/>
    <rect x="400" y="540" width="100" height="360"/>
    <rect x="510" y="610" width="80" height="290"/>
    <rect x="600" y="520" width="55" height="380"/>
    <rect x="665" y="580" width="140" height="320"/>
    <rect x="820" y="500" width="65" height="400"/>
    <rect x="895" y="630" width="110" height="270"/>
    <rect x="1015" y="470" width="75" height="430"/>
    <rect x="1100" y="560" width="95" height="340"/>
    <rect x="1205" y="500" width="60" height="400"/>
    <rect x="1275" y="600" width="130" height="300"/>
    <rect x="1415" y="530" width="70" height="370"/>
    <rect x="1495" y="590" width="105" height="310"/>

    <!-- a couple of taller towers for skyline rhythm -->
    <rect x="740" y="360" width="46" height="540"/>
    <rect x="1040" y="330" width="40" height="570"/>
  </g>

  <!-- sparse lit windows, warm amber, kept minimal and calm -->
  <g fill="#e9b768" opacity="0.55">
    <rect x="45" y="600" width="6" height="8"/>
    <rect x="140" y="560" width="6" height="8"/>
    <rect x="335" y="520" width="6" height="8"/>
    <rect x="420" y="600" width="6" height="8"/>
    <rect x="685" y="640" width="6" height="8"/>
    <rect x="755" y="420" width="6" height="8"/>
    <rect x="840" y="560" width="6" height="8"/>
    <rect x="1030" y="620" width="6" height="8"/>
    <rect x="1055" y="400" width="6" height="8"/>
    <rect x="1220" y="560" width="6" height="8"/>
    <rect x="1300" y="660" width="6" height="8"/>
    <rect x="1435" y="590" width="6" height="8"/>
    <rect x="1520" y="640" width="6" height="8"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
