<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Gulberg City Office</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-32.png" />
<meta name="theme-color" content="#0f1a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GCO" />
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-overlay" aria-hidden="true"></div>
  <div class="login-particles" id="login-particles" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">GCO</div>
      <h1>Gulberg City Office</h1>
      <p>Property Record &amp; Ledger System</p>
    </div>
    <form id="login-form">
      <div class="login-fields">
        <label class="field field-username">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label class="field field-password">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
      </div>
      <div class="modal-error" id="login-error" hidden></div>
      <button type="submit" class="btn btn-accent" id="login-btn"><span id="login-btn-label">Sign in</span></button>
    </form>
  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
