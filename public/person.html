<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Person — Gulberg City Office</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-32.png" />
<meta name="theme-color" content="#0f1a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GCO" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="banner" id="page-banner" hidden></div>

        <div class="detail-header">
          <div>
            <h1 id="person-name">Loading…</h1>
            <div class="meta" id="person-meta">Every deal this person has had with the office, across every module.</div>
          </div>
        </div>

        <div class="grid grid-4" id="person-tiles" style="margin-top:20px;"></div>

        <div id="person-sections"></div>

        <div class="section-title"><h2>Documents</h2></div>
        <div class="text-muted" style="font-size:12px; margin:-10px 0 14px;">Attached to this person directly (a scanned CNIC, say) — separate from any documents attached to their individual plots/records above.</div>
        <div class="card" id="person-documents"></div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <script src="js/common.js"></script>
  <script src="js/person.js"></script>
</body>
</html>
