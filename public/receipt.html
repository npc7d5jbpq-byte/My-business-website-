<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Receipt — Gulberg City Office</title>
<link rel="icon" href="icons/icon-32.png" />
<style>
  :root {
    --receipt-width: 80mm;
    --text: #000;
    --muted: #444;
    --rule: #000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', 'Consolas', ui-monospace, monospace;
    background: #d9d9d9;
    color: var(--text);
    font-size: 12px;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: center; gap: 10px;
    padding: 14px; background: #0f1a2e;
  }
  .toolbar button {
    border: none; border-radius: 8px; padding: 9px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #print-btn { background: #c9973f; color: #1c1404; }
  #close-btn { background: rgba(255,255,255,0.12); color: #fff; }
  .toolbar-note { width: 100%; text-align: center; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; color: #cfd4dd; margin-top: -4px; }

  .page-wrap { display: flex; flex-direction: column; align-items: center; padding: 26px 16px 60px; }

  #receipt {
    background: #fff;
    width: var(--receipt-width);
    padding: 10px 4mm 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
    line-height: 1.45;
  }

  .r-center { text-align: center; }
  .r-brand-name { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
  .r-brand-tag { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .r-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; margin-top: 8px; }

  .r-rule { border: none; border-top: 1px dashed var(--rule); margin: 8px 0; }
  .r-rule.solid { border-top: 1px solid var(--rule); }

  .r-row { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; margin: 2px 0; }
  .r-row .v { text-align: right; font-weight: 700; }

  .r-section-title { font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 2px; }
  .r-party-name { font-size: 12.5px; font-weight: 700; }
  .r-party-sub { font-size: 11px; color: var(--muted); }

  .r-item { margin: 4px 0; }
  .r-item-desc { font-size: 11.5px; }
  .r-item-status { font-size: 10.5px; font-weight: 700; margin-top: 2px; }
  .r-item-amt { display: flex; justify-content: flex-end; font-size: 13px; font-weight: 700; margin-top: 2px; }

  .r-summary-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 0; }
  .r-summary-row.remaining { font-weight: 700; font-size: 13px; padding-top: 6px; }

  .r-sig { margin-top: 22px; font-size: 10.5px; }
  .r-sig-line { border-top: 1px dashed #000; margin: 18px 0 3px; }

  .r-footer { text-align: center; font-size: 10.5px; color: var(--muted); margin-top: 14px; }
  .r-footer .stars { letter-spacing: 4px; margin-bottom: 6px; }

  .r-error {
    max-width: 400px; margin: 60px auto; text-align: center; color: #b91c1c; font-size: 14px;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  @page { size: 80mm auto; margin: 0; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .page-wrap { padding: 0; align-items: stretch; }
    #receipt { box-shadow: none; width: 100%; margin: 0; padding: 2mm 4mm 6mm; }
  }
</style>
</head>
<body>
  <div class="toolbar no-print">
    <button id="print-btn">🖨 Print Receipt</button>
    <button id="close-btn">Close</button>
  </div>
  <div class="toolbar-note no-print">Formatted for an 80mm receipt/thermal printer (the small roll-paper printers used at shops and counters).</div>
  <div class="page-wrap">
    <div id="receipt" hidden></div>
    <div class="r-error" id="receipt-error" hidden></div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/receipt.js"></script>
</body>
</html>
