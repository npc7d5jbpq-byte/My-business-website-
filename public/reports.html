<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports &amp; Ledger — Gulberg City Office</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-32.png" />
<meta name="theme-color" content="#0f1a2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GCO" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="banner" id="page-banner" hidden></div>

        <div class="section-title"><h2>Growth at a Glance</h2></div>
        <div class="grid grid-2" id="growth-tiles" style="margin-bottom:8px;"></div>

        <div class="section-title"><h2>Yearly Summary</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Year</th><th class="text-right">Money In</th><th class="text-right">Money Out</th><th class="text-right">Net</th><th class="text-right">vs Previous Year</th></tr></thead>
            <tbody id="yearly-body"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
          </table>
        </div>

        <div class="section-title"><h2>Monthly Summary</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Month</th><th class="text-right">Money In</th><th class="text-right">Money Out</th><th class="text-right">Net</th><th class="text-right">vs Previous Month</th></tr></thead>
            <tbody id="monthly-body"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
          </table>
        </div>

        <div class="section-title">
          <h2>Full Ledger</h2>
          <div class="pill-tabs" id="module-filter">
            <span class="pill-tab active" data-filter="all">All</span>
            <span class="pill-tab" data-filter="Colony">Colonies</span>
            <span class="pill-tab" data-filter="Agricultural Land">Agricultural Land</span>
            <span class="pill-tab" data-filter="Shops">Shops</span>
            <span class="pill-tab" data-filter="Commercial Land & Plots">Commercial Land &amp; Plots</span>
            <span class="pill-tab" data-filter="Brokers Commission">Brokers Commission</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Module</th><th>Details</th><th>Notes</th><th class="text-right">Amount</th></tr></thead>
            <tbody id="ledger-body"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <script src="js/common.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
