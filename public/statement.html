<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Full Statement — Gulberg City Office</title>
<link rel="icon" href="icons/icon-32.png" />
<style>
  :root {
    --text: #171a20;
    --muted: #5a6072;
    --rule: #d8dbe3;
    --accent: #c9973f;
    --success: #1a7f4e;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #e7e9ee;
    color: var(--text);
    font-size: 13px;
  }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: center; gap: 10px;
    padding: 14px; background: #0f1a2e;
  }
  .toolbar button {
    border: none; border-radius: 8px; padding: 9px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #print-btn { background: #c9973f; color: #1c1404; }
  #close-btn { background: rgba(255,255,255,0.12); color: #fff; }

  .page-wrap { display: flex; flex-direction: column; align-items: center; padding: 26px 16px 60px; }

  #statement {
    background: #fff;
    width: 210mm;
    max-width: 100%;
    min-height: 297mm;
    padding: 16mm 14mm;
    box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  }

  .s-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-bottom: 18px; }
  .s-brand-name { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
  .s-brand-tag { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .s-title { text-align: right; }
  .s-title .t1 { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
  .s-title .t2 { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  .s-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
  .s-info-box { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
  .s-info-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .s-info-name { font-size: 14px; font-weight: 700; }
  .s-info-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .s-summary { display: flex; gap: 14px; margin-bottom: 20px; }
  .s-summary-card { flex: 1; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; text-align: center; }
  .s-summary-card .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .s-summary-card .val { font-size: 16px; font-weight: 800; margin-top: 4px; }

  table.s-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  table.s-table th {
    text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted);
    border-bottom: 2px solid var(--rule); padding: 7px 8px;
  }
  table.s-table td { font-size: 12.5px; padding: 7px 8px; border-bottom: 1px solid var(--rule); }
  table.s-table tr.s-row-pending { color: var(--muted); }
  table.s-table tr.s-row-rescheduled { color: var(--muted); text-decoration: line-through; }
  .text-right { text-align: right; }
  .s-status-paid { color: var(--success); font-weight: 700; }
  .s-status-pending { color: var(--danger); font-weight: 700; }
  .s-status-overdue { color: var(--danger); font-weight: 800; }
  .s-status-rescheduled { font-weight: 700; }

  .s-totals { display: flex; justify-content: flex-end; margin-top: 10px; }
  .s-totals-box { width: 280px; }
  .s-totals-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; }
  .s-totals-row.grand { font-size: 15px; font-weight: 800; border-top: 2px solid var(--rule); margin-top: 4px; padding-top: 8px; }

  .s-footer-note { margin-top: 26px; font-size: 11px; color: var(--muted); }
  .s-sig-row { display: flex; justify-content: space-between; margin-top: 46px; }
  .s-sig { width: 40%; }
  .s-sig-line { border-top: 1px solid #000; padding-top: 6px; font-size: 11.5px; text-align: center; }

  .s-generated { text-align: center; font-size: 10.5px; color: var(--muted); margin-top: 30px; }

  .s-error {
    max-width: 460px; margin: 60px auto; text-align: center; color: #b91c1c; font-size: 14px;
  }

  @page { size: A4; margin: 0; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .page-wrap { padding: 0; align-items: stretch; }
    #statement { box-shadow: none; width: 100%; min-height: 0; margin: 0; }
  }
</style>
</head>
<body>
  <div class="toolbar no-print">
    <button id="print-btn">🖨 Print Statement</button>
    <button id="close-btn">Close</button>
  </div>
  <div class="page-wrap">
    <div id="statement" hidden></div>
    <div class="s-error" id="statement-error" hidden></div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/statement.js"></script>
</body>
</html>
